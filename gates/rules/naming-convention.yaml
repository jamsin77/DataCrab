# 命名规范 Gate 规则
# 来源: openJiuwen-JavaScript-coding-style-guide.md 命名规范 (1.1-1.6)

rules:
  - id: naming-no-pinyin
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "JS-coding-style#1.1"
    message: "禁止使用拼音拼写命名,须使用正确的英文拼写"
    pattern: "(?:\\b(?:xingming|zhanghao|mima|dizhi|shouji|youxiang|yonghu|gongsi|bumen|shijian|riqi|chaxun|xiugai|shanchu|tianjia|chaxun)\\b)"
    match_mode: absent
    includes:
      - "**/*.ts"
      - "**/*.js"
    excludes:
      - "**/*.d.ts"
      - "**/*.test.*"

  - id: naming-limit-abbreviations
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "JS-coding-style#1.2"
    message: "命名尽量少用缩写,除非是常见词(ctx/req/resp)或领域词汇 (不可全自动化: 缺乏基准词表)"
    pattern: "\\b(?:usr|btn|chk|dlg|frm|grp|lst|msg|num|pfx|sfx|val|tmp|hdr|ftr|nav|btn|chk|cfg|ctx|db|dir|doc|env|err|exc|fn|img|info|len|lib|log|max|min|obj|param|pwd|ref|req|res|resp|ret|seg|sel|seq|src|std|str|sys|tbl|tmp|txn|usr|var|ver)\\b"
    match_mode: absent
    includes:
      - "**/*.ts"
      - "**/*.js"
    excludes:
      - "**/*.d.ts"
      - "**/*.test.*"

  - id: naming-class-upper-camel
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "JS-coding-style#1.3"
    message: "类名、枚举名、命名空间名须采用 UpperCamelCase 风格"
    pattern: "\\bclass\\s+[a-z]"
    match_mode: absent
    includes:
      - "**/*.ts"
      - "**/*.js"
    excludes:
      - "**/*.d.ts"
      - "**/*.test.*"

  - id: naming-var-lower-camel
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "JS-coding-style#1.4"
    message: "变量名、方法名、参数名采用 lowerCamelCase 风格 (部分自动化: AST检测更准确)"
    pattern: "(?:let|const|var)\\s+[A-Z][a-zA-Z]+\\s*="
    match_mode: absent
    includes:
      - "**/*.ts"
      - "**/*.js"
    excludes:
      - "**/*.d.ts"
      - "**/*.test.*"

  - id: naming-const-upper-snake
    type: regex-check
    blocking: true
    severity: warning
    scope: incremental
    source: "JS-coding-style#1.5"
    message: "静态常量名、枚举值名须采用全部大写下划线风格 (MAX_SIZE, NOT_FOUND)"
    pattern: "\\bconst\\s+[a-z][a-zA-Z]+\\s*=\\s*(?:\\d+|['\"][^'\"]+['\"]|true|false|null)\\s*;"
    match_mode: absent
    includes:
      - "**/*.ts"
      - "**/*.js"
    excludes:
      - "**/*.d.ts"
      - "**/*.test.*"

  - id: naming-avoid-negative-bool
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "JS-coding-style#1.6"
    message: "避免使用否定的布尔变量名 (isNoError, isNotFound), 布尔变量应加 is/has/can/should 前缀"
    pattern: "\\b(?:isNot|isNo|isUn|hasNo|cannot|shouldNot|isDis)\\w+"
    match_mode: absent
    includes:
      - "**/*.ts"
      - "**/*.js"
    excludes:
      - "**/*.d.ts"
      - "**/*.test.*"
