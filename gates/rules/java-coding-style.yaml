# Java 编码规范 Gate 规则

rules:
  - id: java-no-tab-indent
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "Java规范-缩进"
    message: "禁止使用制表符缩进，使用4个空格"
    pattern: "\t"
    match_mode: absent
    includes:
      - "**/*.java"

  - id: java-no-trailing-whitespace
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "Java规范-格式"
    message: "删除行尾多余空格"
    pattern: " +$"
    match_mode: absent
    includes:
      - "**/*.java"

  - id: java-class-naming
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "Java规范-命名"
    message: "类名必须使用PascalCase，禁用下划线"
    pattern: "^class\\s+[a-z]"
    match_mode: absent
    includes:
      - "**/*.java"

  - id: java-method-naming
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "Java规范-命名"
    message: "方法名必须使用camelCase"
    pattern: "\\bpublic\\s+\\w+\\s+[A-Z]"
    match_mode: absent
    includes:
      - "**/*.java"

  - id: java-constant-naming
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "Java规范-命名"
    message: "常量必须使用UPPER_SNAKE_CASE"
    pattern: "\\bfinal\\s+static\\s+(?!\\w+_)[a-z]"
    match_mode: absent
    includes:
      - "**/*.java"

  - id: java-no-bare-catch
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "Java规范-异常"
    message: "禁止使用裸catch，必须指定具体异常类型"
    pattern: "catch\\s*\\(\\s*Exception\\s+\\w+\\s*\\)"
    match_mode: absent
    includes:
      - "**/*.java"

  - id: java-no-system-exit
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "Java规范-最佳实践"
    message: "禁止使用System.exit()，使用异常或返回码"
    pattern: "System\\.exit\\s*\\("
    match_mode: absent
    includes:
      - "**/*.java"
    excludes:
      - "**/test*.java"

  - id: java-no-sout-in-prod
    type: regex-check
    blocking: false
    severity: warning
    scope: incremental
    source: "Java规范-日志"
    message: "禁止使用System.out/err，使用日志框架"
    pattern: "System\\.(out|err)\\."
    match_mode: absent
    includes:
      - "**/*.java"
    excludes:
      - "**/test*.java"

  - id: java-use-logger
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "Java规范-日志"
    message: "生产代码必须使用日志框架（slf4j/log4j）"
    pattern: "System\\.(out|err)\\."
    match_mode: absent
    includes:
      - "**/*.java"
    excludes:
      - "**/test*.java"
      - "**/*Test.java"

  - id: java-no-null-string-compare
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "Java规范-最佳实践"
    message: "使用Objects.requireNonNull()检查空值，禁止使用==String判断空字符串"
    pattern: "==\\s*(\"\"|'')|\\bstr\\s*==\\s*null"
    match_mode: absent
    includes:
      - "**/*.java"

  - id: java-no-raw-generics
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "Java规范-泛型"
    message: "禁止使用原始类型泛型，必须指定类型参数"
    pattern: "List\\s+<\\w+>|Map\\s+<\\w+,\\s*\\w+>"
    match_mode: absent
    includes:
      - "**/*.java"

  - id: java-use-try-with-resources
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "Java规范-资源管理"
    message: "IO流须使用try-with-resources自动关闭"
    pattern: "new\\s+(FileInputStream|FileOutputStream|BufferedReader|BufferedWriter).*[^;{]$"
    match_mode: absent
    includes:
      - "**/*.java"
    excludes:
      - "**/test*.java"

  - id: java-no-hardcoded-credential
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "Java规范-安全"
    message: "禁止硬编码凭据，使用环境变量或配置文件"
    pattern: "(password|secret|apiKey|token)\\s*=\\s*['\"][^'\"]{8,}"
    match_mode: absent
    includes:
      - "**/*.java"
    excludes:
      - "**/test*.java"
      - "**/*Test.java"
      - "**/resources/**"

  - id: java-sql-injection
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "Java规范-安全"
    message: "使用参数化查询，禁止字符串拼接SQL"
    pattern: "\"\\s*\\+\\s*.*\\.execute\\(|Statement\\.execute\\s*\\("
    match_mode: absent
    includes:
      - "**/*.java"
    excludes:
      - "**/test*.java"

  - id: java-no-synchronized-wrong
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "Java规范-并发"
    message: "同步块须指定明确的对象锁"
    pattern: "synchronized\\s*\\(\\s*this\\s*\\)"
    match_mode: absent
    includes:
      - "**/*.java"

  - id: java-test-class-naming
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "Java规范-测试"
    message: "测试类须以Test结尾，方法以test开头"
    pattern: "@Test\\s+public\\s+void\\s+[A-Z]"
    match_mode: absent
    includes:
      - "**/*Test.java"
      - "**/*Tests.java"

  - id: java-no-print-in-tests
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "Java规范-测试"
    message: "测试中禁止使用print调试"
    pattern: "System\\.out\\.print|sout"
    match_mode: absent
    includes:
      - "**/*Test.java"
      - "**/*Tests.java"

  - id: java-brace-style
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "Java规范-格式"
    message: "左大括号须与代码同一行，单独一行则换行"
    pattern: "^\\s*\\)\\s*\\{\\n\\s*\\w"
    match_mode: absent
    includes:
      - "**/*.java"

  - id: java-max-line-length
    type: regex-check
    blocking: false
    severity: warning
    scope: incremental
    source: "Java规范-格式"
    message: "单行代码建议不超过120字符"
    pattern: ".{121}$"
    match_mode: present
    includes:
      - "**/*.java"

  - id: java-no-println
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "Java规范-日志"
    message: "Log统一使用slf4j，禁止System.out.println"
    pattern: "System\\.out\\.println|System\\.err\\.println"
    match_mode: absent
    includes:
      - "**/*.java"
    excludes:
      - "**/test*.java"
      - "**/*Test.java"