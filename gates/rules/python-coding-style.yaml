# Python 编码规范 Gate 规则
# 来源: my-spec-python-full.md

rules:
  - id: py-no-tab-indent
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "规则1.2"
    message: "禁止使用制表符缩进，使用4个空格"
    pattern: "\t"
    match_mode: absent
    includes:
      - "**/*.py"

  - id: py-no-trailing-whitespace
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "规则1.4"
    message: "删除行尾多余空格"
    pattern: " +$"
    match_mode: absent
    includes:
      - "**/*.py"

  - id: py-no-bare-except
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "规则5.1"
    message: "禁止使用裸except，必须指定具体异常类型"
    pattern: "^\\s*except\\s*:"
    match_mode: absent
    includes:
      - "**/*.py"
    excludes:
      - "**/test*.py"
      - "**/*_test.py"

  - id: py-no-var
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "规则2.3"
    message: "禁止使用var声明变量，使用let/const"
    pattern: "\\bvar\\s+"
    match_mode: absent
    includes:
      - "**/*.py"

  - id: py-use-is-none
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "规则3.4"
    message: "使用is/is not比较None，禁止使用==或!="
    pattern: "==\\s*None|!=None"
    match_mode: absent
    includes:
      - "**/*.py"

  - id: py-no-wildcard-import
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "规则7.2"
    message: "禁止使用from module import *"
    pattern: "from\\s+\\w+\\s+import\\s+\\*"
    match_mode: absent
    includes:
      - "**/*.py"

  - id: py-no-debugger
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "规则11"
    message: "禁止使用debugger语句"
    pattern: "\\bdebugger\\b"
    match_mode: absent
    includes:
      - "**/*.py"

  - id: py-use-with
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "规则8.3"
    message: "文件操作须使用with语句"
    pattern: "open\\([^)]+\\)\\s*[.)]"
    match_mode: absent
    includes:
      - "**/*.py"
    excludes:
      - "**/test*.py"
      - "**/*_test.py"
      - "**/conftest.py"

  - id: py-no-assert-true
    type: regex-check
    blocking: false
    severity: warning
    scope: incremental
    source: "规则9"
    message: "assert语句中禁止使用恒真条件"
    pattern: "assert\\s+True\\b"
    match_mode: absent
    includes:
      - "**/*.py"

  - id: py-no-hardcoded-credential
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "规则10.1"
    message: "禁止硬编码凭据，使用os.getenv()"
    pattern: "api_key\\s*=\\s*['\"][^'\"]{8,}"
    match_mode: absent
    includes:
      - "**/*.py"
    excludes:
      - "**/test*.py"
      - "**/*_test.py"
      - "**/migrations/**"

  - id: py-sql-injection
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "规则10.2"
    message: "使用参数化查询，禁止字符串拼接SQL"
    pattern: "cursor\\.execute\\([^,]+%"
    match_mode: absent
    includes:
      - "**/*.py"
    excludes:
      - "**/test*.py"
      - "**/*_test.py"

  - id: py-use-type-annotation
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "规则4.4"
    message: "公共函数建议添加类型注解"
    pattern: "^def\\s+\\w+\\([^)]*\\):\\s*(->\\s*\\w+)?\\s*:"
    match_mode: absent
    includes:
      - "**/*.py"
    excludes:
      - "**/test*.py"
      - "**/*_test.py"
      - "**/__init__.py"

  - id: py-test-naming
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "规则9.1"
    message: "测试函数须以test_开头，类以Test开头"
    pattern: "^def\\s+[^t]|^class\\s+[^T]"
    match_mode: absent
    includes:
      - "**/test*.py"
      - "**/*_test.py"
      - "**/tests/**"

  - id: py-no-print-in-tests
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "规则14"
    message: "测试中禁止使用print调试"
    pattern: "\\bprint\\s*\\("
    match_mode: absent
    includes:
      - "**/test*.py"
      - "**/*_test.py"
      - "**/tests/**"

  - id: py-async-await
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "规则13.1"
    message: "async函数须使用await，禁止在同步函数中调用异步函数"
    pattern: "^async\\s+def"
    match_mode: present
    includes:
      - "**/*.py"
    excludes:
      - "**/test*.py"
      - "**/*_test.py"
