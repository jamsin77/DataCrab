# 语言风格规范 Gate 规则
# 来源: openJiuwen-style-guide-language-style.md

rules:
  # === 人称及语态 ===

  - id: ls-use-second-person
    type: regex-check
    blocking: false
    severity: warning
    scope: incremental
    source: "语言风格规范#人称-1"
    message: "使用第二人称, 人称代词默认省略, 推荐使用'开发者'而非'你'"
    pattern: "你(?!们)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  - id: ls-prefer-active-voice
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "语言风格规范#人称-2"
    message: "尽量使用主动语态 (建议)"
    pattern: "(?:被|受到|遭到|予以|加以)\\s*[\\u4e00-\\u9fff\\w]+"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  # === 语气及用词 ===

  - id: ls-objective-tone
    type: regex-check
    blocking: false
    severity: warning
    scope: incremental
    source: "语言风格规范#语气-1"
    message: "客观陈述内容,口吻友好, 避免命令/威胁语气"
    pattern: "(?:必须|务必|否则后果|否则自行承担)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  - id: ls-no-slang
    type: regex-check
    blocking: false
    severity: warning
    scope: incremental
    source: "语言风格规范#语气-2"
    message: "避免使用口语化词语"
    pattern: "不准|的话|就可以了|做…用|踢出"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  - id: ls-no-jargon
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "语言风格规范#语气-3"
    message: "避免行话, 行话只有小部分人员能理解且难以翻译"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  - id: ls-no-idiom
    type: regex-check
    blocking: false
    severity: warning
    scope: incremental
    source: "语言风格规范#语气-4"
    message: "避免成语和俗语, 翻译时难以传达确切含义"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  - id: ls-no-bias-terms
    type: regex-check
    blocking: true
    severity: error
    scope: incremental
    source: "语言风格规范#语气-5"
    message: "避免使用可能带有偏见或歧视含义的词汇 (master/slave, whitelist/blacklist)"
    pattern: "\\b(?:master/slave|whitelist/blacklist)\\b"
    match_mode: absent
    includes:
      - "**/*.md"
      - "**/*.ts"
      - "**/*.js"
    excludes: []

  - id: ls-no-negative-emotion-words
    type: regex-check
    blocking: false
    severity: warning
    scope: incremental
    source: "语言风格规范#语气-6"
    message: "避免使用可能引起操作者负面情绪的词语"
    pattern: "(?:垃圾|废物|蠢|笨|白痴|傻瓜|你已|你被踢出)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  # === 用户视角 ===

  - id: ls-write-for-target-user
    type: regex-check
    blocking: false
    severity: hint
    scope: full-only
    source: "语言风格规范#用户视角-1"
    message: "为目标用户写作, 明确文档面向的用户类型 (需人工确认)"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  - id: ls-write-for-user-scenario
    type: regex-check
    blocking: false
    severity: hint
    scope: full-only
    source: "语言风格规范#用户视角-2"
    message: "面向用户场景和用户任务写作, 而非产品功能 (需人工确认)"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  # === 完整 ===

  - id: ls-no-missing-task-scenario
    type: regex-check
    blocking: false
    severity: hint
    scope: full-only
    source: "语言风格规范#完整-1"
    message: "避免任务场景缺失, 应通过用户与任务分析明确需提供的指导信息 (需人工确认)"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  # === 具体 ===

  - id: ls-concrete-not-abstract
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "语言风格规范#具体-1"
    message: "用具体的描述代替抽象/晦涩的描述 (需人工确认)"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  - id: ls-no-vague-quantity
    type: regex-check
    blocking: false
    severity: warning
    scope: incremental
    source: "语言风格规范#具体-2"
    message: "表示数量或程度时避免笼统的'多''少''大', 改用具体数字"
    pattern: "(?:较大多|较少多|很大|很小|较慢|较快|较多|较少|较大|较小)\\s*[的了]?"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  # === 简洁 ===

  - id: ls-simple-sentence-structure
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "语言风格规范#简洁-1"
    message: "使用主谓/主谓宾结构的句子, 避免不必要的修饰成分"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  - id: ls-no-long-run-on-sentence
    type: regex-check
    blocking: false
    severity: warning
    scope: incremental
    source: "语言风格规范#简洁-2"
    message: "避免长连句, 同一句中逗号数不能超过5个"
    pattern: "[^\\n]*[，,][^\\n]*[，,][^\\n]*[，,][^\\n]*[，,][^\\n]*[，,][^\\n]*[，,]"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  - id: ls-no-double-negative
    type: regex-check
    blocking: false
    severity: warning
    scope: incremental
    source: "语言风格规范#简洁-3"
    message: "禁止使用双重否定"
    pattern: "(?:不是不|不能不|不会不|并非不|没有不|不得不|不能没有)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  - id: ls-direct-statement
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "语言风格规范#简洁-4"
    message: "言简意赅直接陈述, 避免表示程度/语气的无意义词语"
    pattern: "(?:还是比较|基本上|决定性地|当然是|然而呢|一般而言的)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  - id: ls-trim-unnecessary-info
    type: regex-check
    blocking: false
    severity: hint
    scope: full-only
    source: "语言风格规范#简洁-5"
    message: "根据用户技能水平剔除不必要的信息 (需人工确认)"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  # === 清晰 ===

  - id: ls-clear-description
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "语言风格规范#清晰-1"
    message: "确保语言描述清晰不模糊, 每个代词有清晰指代 (需人工确认)"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  - id: ls-clear-logic
    type: regex-check
    blocking: false
    severity: hint
    scope: full-only
    source: "语言风格规范#清晰-2"
    message: "确保逻辑清晰, 采用合理的写作顺序 (需人工确认)"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  - id: ls-use-tables-figures
    type: regex-check
    blocking: false
    severity: hint
    scope: full-only
    source: "语言风格规范#清晰-3"
    message: "适当使用图表使逻辑和表意更直观 (需人工确认)"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  - id: ls-no-specific-device-model
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "语言风格规范#清晰-4"
    message: "阐述规格/约束时不使用具体设备型号, 告知如何判断功能是否可用 (需人工确认)"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  # === 一致 ===

  - id: ls-consistent-terminology
    type: regex-check
    blocking: false
    severity: warning
    scope: incremental
    source: "语言风格规范#一致-1"
    message: "用词一致: 术语/缩略语/描述同一对象的词汇全文一致, 参见常用词表"
    pattern: "(?:登陆[^记]|点击[^击]|图象[^像]|记费[^计]|阀值[^阈])"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  - id: ls-consistent-structure
    type: regex-check
    blocking: false
    severity: hint
    scope: full-only
    source: "语言风格规范#一致-2"
    message: "相同文档或同类信息保持结构一致 (需人工确认)"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  - id: ls-consistent-sentence-pattern
    type: regex-check
    blocking: false
    severity: hint
    scope: full-only
    source: "语言风格规范#一致-3"
    message: "句式一致, 统一使用祈使句描述动作 (需人工确认)"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  - id: ls-consistent-format
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "语言风格规范#一致-4"
    message: "格式一致: 同类元素如代码块/文件路径等格式保持一致 (需人工确认)"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []

  - id: ls-recommended-word-usage
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "语言风格规范#一致-5"
    message: "常用词推荐用法 (建议): 界面>页面, 短消息>短信, 数据包>数据报"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "**/*.md"
    excludes: []
