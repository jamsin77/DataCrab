# 许可证与版权规范 Gate 规则
# 来源: openJiuwen 许可证与版权规范.md

rules:
  # === LICENSE 文件 ===

  - id: license-file-exists
    type: section-check
    blocking: true
    severity: error
    scope: full-only
    source: "许可证与版权规范#LICENSE-1"
    message: "每个开源仓必须在根目录包含 LICENSE 文件"
    file: "LICENSE"
    pattern: ".+"
    match_mode: present
    includes:
      - "LICENSE"
    excludes: []

  - id: license-is-plain-text
    type: regex-check
    blocking: true
    severity: error
    scope: full-only
    source: "许可证与版权规范#LICENSE-2"
    message: "LICENSE 文件必须为纯文本格式，无文件后缀 (.txt/.md 等)"
    file: "LICENSE"
    pattern: ".+"
    match_mode: present
    includes:
      - "LICENSE"
    excludes:
      - "LICENSE.*"

  - id: license-multi-license-naming
    type: regex-check
    blocking: false
    severity: hint
    scope: full-only
    source: "许可证与版权规范#LICENSE-3"
    message: "多许可证文件以 LICENSE-许可证类型-备注 命名, 不同许可证对应源码分别在各自目录"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "LICENSE*"
    excludes: []

  - id: license-must-cover-all-files
    type: regex-check
    blocking: false
    severity: hint
    scope: full-only
    source: "许可证与版权规范#LICENSE-4"
    message: "许可证文件必须涵盖该仓下所有文件,不包含不在本仓发布的源代码许可"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "LICENSE"
    excludes: []

  - id: license-binary-release-location
    type: regex-check
    blocking: false
    severity: hint
    scope: full-only
    source: "许可证与版权规范#LICENSE-5"
    message: "二进制发布时许可证文件位于发布格式常规位置 (.jar 在 META-INF)"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "LICENSE"
    excludes: []

  # === NOTICE 文件 ===

  - id: notice-file-for-third-party
    type: regex-check
    blocking: false
    severity: warning
    scope: full-only
    source: "许可证与版权规范#NOTICE-1"
    message: "如分发的二进制包含第三方开源软件，需提供 NOTICE 文件描述第三方信息"
    file: "NOTICE"
    pattern: ".+"
    match_mode: present
    includes:
      - "NOTICE"
    excludes: []

  - id: notice-file-location
    type: regex-check
    blocking: false
    severity: hint
    scope: full-only
    source: "许可证与版权规范#NOTICE-2"
    message: "NOTICE 文件放置在发布文件夹或压缩包的顶层目录, .jar 在 META-INF"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "NOTICE"
    excludes: []

  # === 版权和许可头 ===

  - id: copyright-header-in-source
    type: regex-check
    blocking: true
    severity: warning
    scope: incremental
    source: "许可证与版权规范#版权-1"
    message: "源代码文件应包含版权头声明 (Copyright (C) ...)"
    pattern: "Copyright\\s+\\(C\\)\\s+\\d{4}"
    match_mode: present
    includes:
      - "**/*.ts"
      - "**/*.js"
    excludes:
      - "**/*.d.ts"
      - "**/*.test.*"
      - "**/dist/**"

  - id: apache-license-header
    type: regex-check
    blocking: false
    severity: hint
    scope: incremental
    source: "许可证与版权规范#版权-2"
    message: "Apache 2.0 许可头: Licensed under the Apache License, Version 2.0"
    pattern: "Licensed under the Apache License"
    match_mode: present
    includes:
      - "**/*.ts"
      - "**/*.js"
    excludes:
      - "**/*.d.ts"
      - "**/*.test.*"
      - "**/dist/**"

  - id: copyright-year-range
    type: regex-check
    blocking: false
    severity: hint
    scope: full-only
    source: "许可证与版权规范#版权-3"
    message: "版权年份应格式为: 首次发布年份-当前年份 (如 2024-2026)"
    pattern: "Copyright\\s+\\(C\\)\\s+\\d{4}-\\d{4}"
    match_mode: present
    includes:
      - "**/*.ts"
      - "**/*.js"
    excludes:
      - "**/*.d.ts"
      - "**/*.test.*"
      - "**/dist/**"

  - id: copyright-owner-must-be-entity
    type: regex-check
    blocking: false
    severity: hint
    scope: full-only
    source: "许可证与版权规范#版权-4"
    message: "版权所有者是法律实体, 代表公司贡献代码时写公司法律实体 (需人工确认)"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "**/*.ts"
      - "**/*.js"
    excludes: []

  - id: copyright-header-must-match-repo-license
    type: regex-check
    blocking: false
    severity: hint
    scope: full-only
    source: "许可证与版权规范#版权-5"
    message: "许可头信息必须与该开源仓的许可证信息一致 (需人工确认)"
    pattern: "(?!)"
    match_mode: absent
    includes:
      - "**/*.ts"
      - "**/*.js"
    excludes: []
