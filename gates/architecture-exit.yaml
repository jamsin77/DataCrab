# Architecture Roundtable Exit Gate
# Validates architecture outputs after arch-roundtable completes

rules:
  - id: arch-has-overview
    type: regex-check
    blocking: true
    message: "Architecture design must have Overview section"
    file: "{arch_doc}"
    pattern: "## Overview"

  - id: arch-has-spi
    type: regex-check
    blocking: true
    message: "Architecture design must have SPI section"
    file: "{arch_doc}"
    pattern: "## SPI"

  - id: arch-has-dfx
    type: regex-check
    blocking: true
    message: "Architecture design must have DFX section with quantifiable metrics"
    file: "{arch_doc}"
    pattern: "## DFX"

  - id: adr-status-accepted
    type: regex-check
    blocking: true
    message: "ADR status must be Accepted"
    file: "{adr}"
    pattern: "Accepted"

  - id: dfx-has-metrics
    type: regex-check
    blocking: false
    message: "DFX section should include quantifiable performance budgets"
    file: "{arch_doc}"
    pattern: "\\d+\\s*(ms|s|MB|GB|%|req/s|RPS|QPS)"
