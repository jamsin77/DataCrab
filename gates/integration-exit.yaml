# Integration Exit Gate
# Validates integration verification results

rules:
  - id: spi-tests-pass
    type: exec
    blocking: true
    message: "SPI contract tests must pass"
    command: "cd {project_root} && npx vitest run --reporter=verbose 2>&1 | grep -q 'Tests.*passed'"

  - id: feature-tests-pass
    type: exec
    blocking: true
    message: "Feature acceptance tests must pass"
    command: "cd {project_root} && npx vitest run --reporter=verbose 2>&1 | grep -q 'Tests.*passed'"

  - id: e2e-tests-pass
    type: exec
    blocking: false
    message: "E2E tests should pass"
    command: "cd {project_root} && npx vitest run --reporter=verbose 2>&1 | grep -q 'Tests.*passed'"

  - id: no-open-defects
    type: exec
    blocking: true
    message: "No open defects should remain"
    command: "test $(find {project_root}/defects -name '*.open.md' 2>/dev/null | wc -l) -eq 0"
