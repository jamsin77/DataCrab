# Requirements Analysis Exit Gate
# Validates output artifacts after requirements-analysis stage completes

rules:
  - id: context-has-terms
    type: section-check
    blocking: true
    message: "CONTEXT.md must have at least 1 term definition in the Language section"
    file: "CONTEXT.md"
    required_sections: 1

  - id: context-has-language-section
    type: regex-check
    blocking: true
    message: "CONTEXT.md must have a Language section with defined terms"
    file: "CONTEXT.md"
    pattern: "## Language"

  - id: prd-exists
    type: regex-check
    blocking: true
    message: "PRD must exist and contain Problem Statement"
    file: "{prd}"
    pattern: "## Problem Statement"

  - id: prd-has-user-stories
    type: regex-check
    blocking: true
    message: "PRD must have a User Stories section"
    file: "{prd}"
    pattern: "## User Stories"
