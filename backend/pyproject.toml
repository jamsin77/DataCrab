[tool.poetry]
name = "datacrab-backend"
version = "1.0.0"
description = "DataCrab 数据工程智能体后端"
authors = ["DataCrab Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.100.0"
uvicorn = {version = "^0.23.0", extras = ["standard"]}
sqlalchemy = "^2.0"
asyncpg = "^0.28.0"
alembic = "^1.12.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
passlib = {version = "^1.7.4", extras = ["bcrypt"]}
python-multipart = "^0.0.6"
httpx = "^0.25.0"
pandas = "^2.1.0"
numpy = "^1.25.0"
openpyxl = "^3.1.0"
aiofiles = "^23.2.0"
loguru = "^0.7.0"
tenacity = "^8.2.0"
python-dateutil = "^2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
