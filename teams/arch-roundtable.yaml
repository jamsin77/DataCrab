# Architecture Roundtable Team Configuration
# 5 default Teammate roles for architecture review discussions

team:
  name: arch-roundtable
  description: "Multi-perspective architecture review panel"

  params:
    discussion_rounds: 3
    question_mode: probe  # probe | suggest

  members:
    - name: security-architect
      role: security
      provider: trae
      capabilities:
        - security-review
        - architecture
        - refactoring

    - name: performance-architect
      role: performance
      provider: trae
      capabilities:
        - architecture
        - code-review
        - refactoring

    - name: reliability-architect
      role: reliability
      provider: cursor
      capabilities:
        - architecture
        - code-review
        - research

    - name: maintainability-architect
      role: maintainability
      provider: cursor
      capabilities:
        - code-edit
        - refactoring
        - documentation

    - name: testability-architect
      role: testability
      provider: claude-code
      capabilities:
        - code-edit
        - testing
        - general
